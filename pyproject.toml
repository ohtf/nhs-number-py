[tool.poetry]
name = "nhs-number"
version = "3.0.0"
description = "Python package to provide utilities for NHS Numbers, including validity checks, normalisation, and generation."
authors = [
    "Andy Law <andy.law@roslin.ed.ac.uk>",
    "Marcus Baw <marcus@marcusbaw.com>",
    ]
license = "MIT"
readme = "README.md"
packages = [{include = "nhs_number"}]
homepage = "https://ohtf.github.io/nhs-number-py/"
documentation = "https://ohtf.github.io/nhs-number-py/"
repository = "https://github.com/ohtf/nhs-number-py"

exclude = ["tests/local-test-data/*"]

classifiers = [
    'Development Status :: 5 - Production/Stable',
    'License :: OSI Approved :: MIT License',
    'Topic :: Scientific/Engineering :: Mathematics',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'Intended Audience :: Developers',
    'Intended Audience :: Healthcare Industry',
    'Intended Audience :: Science/Research',
    'Topic :: Scientific/Engineering :: Medical Science Apps.',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: 3.15',
    ]

[tool.poetry.dependencies]
python = "^3.10"

[tool.poetry.group.dev.dependencies]
pytest = "^9.2.0"
pytest-cov = "^7.1.0"
black = "^26.10.1"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
zensical = { version = "^0.1.0", python = ">=3.11" }

[tool.poetry.urls]
"Issue Tracker" = "https://github.com/ohtf/nhs-number-py/issues"

[build-system]
requires = ["poetry-core>=2.5.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 79
